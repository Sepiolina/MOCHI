name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Supported platforms (plan O11): Ubuntu 22.04 is the floor (webkit2gtk 4.1,
        # glibc for the .deb), 24.04 the current LTS. GitHub's Windows runners are
        # Windows Server; client-only behaviour goes on the release checklist.
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # ubuntu-22.04 and ubuntu-24.04 share a job name and `runner.os`; without
          # this the 22.04 job restores 24.04's build scripts (glibc 2.39).
          key: ${{ matrix.os }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: AGENTS.md invariants
        shell: bash
        run: bash ci/check-invariants.sh

  fuzz-smoke:
    name: fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `seeds`: corpus directories, relative to fuzz/. `args`: extra
        # libFuzzer flags. The first seven targets are unchanged.
        include:
          - { target: frame_walker,    seeds: "../fixtures/golden/c1 ../fixtures/golden/c2 ../fixtures/golden/c3 ../fixtures/golden/c4", args: "" }
          - { target: footer,          seeds: "../fixtures/golden/c1 ../fixtures/golden/c2 ../fixtures/golden/c3 ../fixtures/golden/c4", args: "" }
          - { target: envelope,        seeds: "../fixtures/golden/c1 ../fixtures/golden/c2 ../fixtures/golden/c3 ../fixtures/golden/c4", args: "" }
          - { target: object_decode,   seeds: "../fixtures/golden/c1 ../fixtures/golden/c2 ../fixtures/golden/c3 ../fixtures/golden/c4", args: "" }
          - { target: catalog_image,   seeds: "../fixtures/golden/c1 ../fixtures/golden/c2 ../fixtures/golden/c3 ../fixtures/golden/c4", args: "" }
          - { target: cbor_decode,     seeds: "../fixtures/golden/c1 ../fixtures/golden/c2 ../fixtures/golden/c3 ../fixtures/golden/c4", args: "" }
          - { target: manifest_decode, seeds: "../fixtures/golden/c1 ../fixtures/golden/c2 ../fixtures/golden/c3 ../fixtures/golden/c4", args: "" }
          # T11/T12 (approved 2026-10-04): whole archives, including the
          # delta-segment vectors whose heads exercise the segment
          # assertions. Archives reach ~150 KB, above libFuzzer's default
          # max_len.
          - { target: archive_open,      seeds: "../fixtures/golden/c5 ../fixtures/golden/c11", args: "-max_len=400000" }
          # Their own vectors: commit records (c5/*.bin), descriptors (b2).
          - { target: commit_decode,     seeds: "../fixtures/golden/c5", args: "" }
          - { target: descriptor_decode, seeds: "../fixtures/golden/b2", args: "" }
          # C10 (D19): the TAR-compatible profile's stream parser.
          - { target: tar_stream,        seeds: "../fixtures/golden/c10", args: "-max_len=100000" }
          # C11 (D20): key envelopes and sealed objects.
          - { target: key_envelope,      seeds: "../fixtures/golden/c11", args: "" }
          - { target: sealed_object,     seeds: "../fixtures/golden/c11", args: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # libFuzzer requires every corpus directory on its command line to
      # exist, and corpus/ is gitignored, so a fresh checkout lacks it.
      # Without this step every target fails at once with "The required
      # directory ... does not exist" (exit 1); found 2026-10-04 by running
      # the job's commands locally, and true of the original seven targets.
      - name: Create the working corpus directory
        working-directory: fuzz
        run: mkdir -p corpus/${{ matrix.target }}
      # Deterministic: every seed is executed once (-runs=0), so the
      # exerciser's assertions run on every vector before any mutation.
      # For archive_open that includes the two valid delta-head archives;
      # the stable test job additionally asserts those come back
      # `OpenedDelta` (c5_golden, fuzz_smoke_over_mutated_inputs), proving
      # the segment assertions are reached, not just built.
      - name: Execute every seed once
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} ${{ matrix.seeds }} -- -runs=0 ${{ matrix.args }}
      - name: Fuzz 60 seconds, seeded from the golden vectors
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} ${{ matrix.seeds }} -- -max_total_time=60 ${{ matrix.args }}

  powercut:
    # Gate G7 (spec Annex B.2.6): power loss at every step of D13 creation,
    # on ext4 over dm-flakey, separate from the process-crash tests in
    # t22_creation.rs. Needs root and the dm-flakey module, which GitHub's
    # Ubuntu runners provide (linux-modules-extra if not loaded).
    name: power loss (${{ matrix.os }}, dm-flakey)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Build the power-cut helper
        run: cargo build --locked -p mochi-testkit --example g7_powercut
      - name: Load dm-flakey
        run: |
          command -v dmsetup || { sudo apt-get update && sudo apt-get install -y dmsetup; }
          sudo modprobe dm-flakey || {
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe dm-flakey
          }
      - name: Cut power at every creation step
        run: sudo bash ci/g7-powercut.sh target/debug/examples/g7_powercut

  casefold:
    # Plan C6: case-insensitive destination detection and the collision
    # preflight on a real case-folding filesystem (ext4 casefold over a
    # loop file). Needs root for the mount and a kernel with CONFIG_UNICODE,
    # which GitHub's Ubuntu runners have.
    name: restore to ext4 casefold (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Build the test
        run: cargo test --locked -p mochi-testkit --test c6_restore_races --no-run
      - name: Mount ext4 with casefold
        run: |
          truncate -s 64M "$RUNNER_TEMP/cf.img"
          mkfs.ext4 -q -O casefold "$RUNNER_TEMP/cf.img"
          sudo mkdir -p /mnt/cf
          sudo mount -o loop "$RUNNER_TEMP/cf.img" /mnt/cf
          sudo mkdir /mnt/cf/d
          sudo chattr +F /mnt/cf/d
          sudo chown "$(id -u):$(id -g)" /mnt/cf/d
          lsattr -d /mnt/cf/d
      - name: Detect case-insensitivity and preflight collisions
        env:
          MOCHI_CASEFOLD_DIR: /mnt/cf/d
        run: cargo test --locked -p mochi-testkit --test c6_restore_races -- --ignored --exact c6_casefold_destination

  tar-interop:
    # Plan C10 (spec 7.2, Annex B.2.9 D19 rule 10): a TAR-compatible archive
    # decoded by the reference zstd CLI and extracted by GNU tar and by
    # bsdtar (libarchive). The versions printed here are the only ones the
    # compatibility claim in docs/c10-tar-compat.md may name.
    name: tar interop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Install zstd and bsdtar (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zstd libarchive-tools
      - name: Install zstd (Windows, if the image lacks it)
        if: runner.os == 'Windows'
        shell: bash
        run: command -v zstd || choco install zstandard -y --no-progress
      - name: Build mochi
        run: cargo build --locked -p mochi-cli
      - name: Extract with each tool
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # Git for Windows' GNU tar first on PATH in bash; bsdtar is the
            # system tar.exe (libarchive). Both by explicit path.
            mochi="$PWD/target/debug/mochi.exe"
            gnu=/usr/bin/tar
            bsd=/c/Windows/System32/tar.exe
          else
            mochi="$PWD/target/debug/mochi"
            gnu=tar
            bsd=bsdtar
          fi
          # Windows may install zstd after this shell started; refresh PATH.
          export PATH="$PATH:/c/ProgramData/chocolatey/bin"
          bash ci/tar-interop.sh "$mochi" zstd "$gnu" "$bsd" | tee "$RUNNER_TEMP/interop.txt"
          { echo '### tar interop (${{ matrix.os }})'; echo '```'; sed -n '/^== versions/,/^== mochi verify/p' "$RUNNER_TEMP/interop.txt" | sed '$d'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  doc-nightly:
    # Stable rustdoc ignores the error code in `compile_fail,E0308`; nightly
    # enforces it. The C2 representation-type guarantees (repr.rs) depend on
    # each block failing for the *intended* reason.
    name: compile_fail doctests (codes enforced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Doctests with error codes checked
        run: cargo +nightly test --doc -p mochi-format

  # Added as their phases land (plan §5, §8.1). Not present yet, on purpose:
  #   e2e          - D0+: tauri-driver + WebdriverIO on Windows and Ubuntu (all supported platforms)
  #   ui           - D0+: pnpm install --frozen-lockfile, eslint, tsc --noEmit, vitest, ts-rs types fresh
