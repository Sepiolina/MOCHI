[workspace]
resolver = "2"
members = [
    "crates/mochi-format",
    "crates/mochi-core",
    "crates/mochi-cli",
    "crates/mochi-testkit",
]
# apps/mochi-desktop/src-tauri joins the workspace when decision O1 is made
# (plan §9) and phase D0 starts. See apps/mochi-desktop/README.md.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
mochi-format = { path = "crates/mochi-format" }
mochi-core = { path = "crates/mochi-core" }
mochi-testkit = { path = "crates/mochi-testkit" }
clap = { version = "4", features = ["derive", "string"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
blake3 = { version = "1", default-features = false, features = ["std"] }
zstd = "0.13"
getrandom = "0.3"
ciborium = "0.2"
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
proptest = { version = "1", default-features = false, features = ["std"] }

# AGENTS.md: library crates must not unwrap/expect/panic on paths reachable
# from archive contents. Unit tests opt out locally with cfg_attr(test, ...).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
