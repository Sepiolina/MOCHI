[package]
name = "mochi-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mochi-testkit = { path = "../crates/mochi-testkit" }

# Standalone workspace: cargo-fuzz needs nightly and must not affect the main build.
[workspace]

[[bin]]
name = "frame_walker"
path = "fuzz_targets/frame_walker.rs"
test = false
doc = false
bench = false

